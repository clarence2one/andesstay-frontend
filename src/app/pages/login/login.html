<div class="login-shell">
  <div class="orb orb-a"></div>
  <div class="orb orb-b"></div>
  <div class="star star-1">✦</div>
  <div class="star star-2">✧</div>
  <div class="star star-3">✦</div>

  <div class="login-card">
    <div class="card-glow"></div>
    <div class="card-body">
      <div class="logo">🏔️</div>
      <h1 class="title">Andes<span class="title-accent">Stay</span></h1>
      <p class="tagline">Hospedajes únicos entre la Patagonia y los Andes</p>

      <div class="feature-grid">
        <div class="feature">
          <span class="feature-icon">🏨</span>
          <span class="feature-label">Catálogo</span>
        </div>
        <div class="feature">
          <span class="feature-icon">🔐</span>
          <span class="feature-label">Login Entra ID</span>
        </div>
        <div class="feature">
          <span class="feature-icon">📋</span>
          <span class="feature-label">Reservas</span>
        </div>
        <div class="feature">
          <span class="feature-icon">📊</span>
          <span class="feature-label">Reportes</span>
        </div>
      </div>

      <button class="btn btn-primary login-btn" (click)="login()">
        <svg width="20" height="20" viewBox="0 0 23 23" xmlns="http://www.w3.org/2000/svg" fill="none" aria-hidden="true">
          <path d="M11 0H0V11H11V0Z" fill="#F25022"/>
          <path d="M23 0H12V11H23V0Z" fill="#7FBA00"/>
          <path d="M11 12H0V23H11V12Z" fill="#00A4EF"/>
          <path d="M23 12H12V23H23V12Z" fill="#FFB900"/>
        </svg>
        Iniciar sesión con Microsoft
      </button>

      <p class="proto">Protocolo OAuth 2.0 / OpenID Connect · Authorization Code + PKCE</p>
      <p class="tenant">Tenant {{ environment.azure.tenantId }}</p>
    </div>
  </div>

  <div class="mountains" aria-hidden="true">
    <svg viewBox="0 0 1440 320" preserveAspectRatio="none" width="100%" height="220" role="presentation">
      <path d="M0 320 L120 170 L240 280 L400 90 L540 250 L680 130 L820 290 L960 150 L1100 270 L1240 110 L1360 260 L1440 200 L1440 320 Z" fill="rgba(30,58,95,0.85)"/>
      <path d="M0 320 L160 210 L300 300 L460 140 L600 290 L760 180 L920 305 L1080 190 L1240 300 L1440 240 L1440 320 Z" fill="rgba(18,41,77,0.9)"/>
      <circle cx="1180" cy="70" r="34" fill="rgba(255,235,190,0.9)"/>
      <circle cx="1180" cy="70" r="54" fill="rgba(255,235,190,0.12)"/>
    </svg>
  </div>
</div>
