<div style="min-height: 80vh; display: flex; align-items: center; justify-content: center; font-family: 'Segoe UI', Roboto, Arial, sans-serif;">
  <div style="max-width: 460px; width: 90%; background: #ffffff; border-radius: 24px; padding: 2.5rem; box-shadow: 0 20px 60px rgba(0,0,0,0.12); text-align: center; border: 1px solid #edf2f7;">
    <div style="font-size: 3.2rem; margin-bottom: 0.75rem;">🏔️</div>
    <h1 style="color: #1a365d; font-size: 2rem; margin: 0 0 0.25rem 0;">AndesStay</h1>
    <p style="color: #718096; margin: 0 0 2rem 0; font-size: 1rem;">
      Hospedajes únicos en la Patagonia y los Andes
    </p>

    <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 0.75rem; margin-bottom: 2rem; text-align: left;">
      <div style="background: #f7fafc; border-radius: 12px; padding: 0.9rem; border: 1px solid #edf2f7;">
        <div style="font-size: 1.3rem;">🏨</div>
        <div style="font-weight: 700; color: #2d3748; font-size: 0.9rem;">Catálogo</div>
      </div>
      <div style="background: #f7fafc; border-radius: 12px; padding: 0.9rem; border: 1px solid #edf2f7;">
        <div style="font-size: 1.3rem;">🔐</div>
        <div style="font-weight: 700; color: #2d3748; font-size: 0.9rem;">Login Entra ID</div>
      </div>
      <div style="background: #f7fafc; border-radius: 12px; padding: 0.9rem; border: 1px solid #edf2f7;">
        <div style="font-size: 1.3rem;">📋</div>
        <div style="font-weight: 700; color: #2d3748; font-size: 0.9rem;">Reservas</div>
      </div>
      <div style="background: #f7fafc; border-radius: 12px; padding: 0.9rem; border: 1px solid #edf2f7;">
        <div style="font-size: 1.3rem;">📊</div>
        <div style="font-weight: 700; color: #2d3748; font-size: 0.9rem;">Reportes</div>
      </div>
    </div>

    <button
      (click)="login()"
      style="width: 100%; padding: 0.95rem; border-radius: 12px; border: none; background: linear-gradient(135deg, #3182ce 0%, #2b6cb0 100%); color: #fff; font-size: 1.05rem; font-weight: 700; cursor: pointer; box-shadow: 0 8px 20px rgba(49,130,206,0.35); display: flex; align-items: center; justify-content: center; gap: 0.6rem;"
    >
      <svg width="22" height="22" viewBox="0 0 23 23" xmlns="http://www.w3.org/2000/svg" fill="none">
        <path d="M11 0H0V11H11V0Z" fill="#F25022"/>
        <path d="M23 0H12V11H23V0Z" fill="#7FBA00"/>
        <path d="M11 12H0V23H11V12Z" fill="#00A4EF"/>
        <path d="M23 12H12V23H23V12Z" fill="#FFB900"/>
      </svg>
      Iniciar Sesión con Microsoft
    </button>

    <p style="margin: 1.2rem 0 0 0; font-size: 0.78rem; color: #a0aec0;">
      Protocolo OAuth 2.0 / OpenID Connect con Authorization Code + PKCE
    </p>
    <p style="margin: 0.25rem 0 0 0; font-size: 0.75rem; color: #cbd5e0;">
      Tenant {{ environment.azure.tenantId }}
    </p>
  </div>
</div>
