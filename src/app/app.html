<header style="background-color: #1e293b; color: white; padding: 1rem 2rem; display: flex; justify-content: space-between; align-items: center;">
  <div style="font-size: 1.25rem; font-weight: bold;">
    🏔️ AndesStay
  </div>

  <nav *ngIf="authService.isAuthenticated$ | async" style="display: flex; gap: 1rem;">
    <a routerLink="/dashboard" routerLinkActive="active" style="color: white; text-decoration: none;">Dashboard</a>
    <a routerLink="/reservations" routerLinkActive="active" style="color: white; text-decoration: none;">Reservas</a>
    <a routerLink="/catalog" routerLinkActive="active" style="color: white; text-decoration: none;">Catálogo</a>
    <a routerLink="/reports" routerLinkActive="active" style="color: white; text-decoration: none;">Reportes</a>
    <a routerLink="/audit" routerLinkActive="active" style="color: white; text-decoration: none;">Auditoría</a>
  </nav>

  <div>
    <ng-container *ngIf="authService.isAuthenticated$ | async; else loginBtn">
      <span style="margin-right: 1rem;">👤 {{ authService.getUserName() }}</span>
      <button (click)="logout()" style="background-color: #ef4444; color: white; border: none; padding: 0.5rem 1rem; border-radius: 4px; cursor: pointer;">
        Cerrar Sesión
      </button>
    </ng-container>
    <ng-template #loginBtn>
      <button (click)="login()" style="background-color: #2563eb; color: white; border: none; padding: 0.5rem 1rem; border-radius: 4px; cursor: pointer;">
        Iniciar Sesión con Entra ID
      </button>
    </ng-template>
  </div>
</header>

<main style="padding: 2rem;">
  <router-outlet></router-outlet>
</main>
